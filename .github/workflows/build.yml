name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix Maven repos for GitHub Actions
        run: |
          sed -i 's|maven(url = "https://maven.aliyun.com/repository/public")|maven(url = "https://maven.aliyun.com/repository/public")\n            // aliyun mirror disabled for CI, fallback below\n        // |g' settings.gradle.kts || true
          # Overwrite settings.gradle.kts to use reliable repos in CI
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google {
                      content {
                          includeGroupByRegex("com\\.android.*")
                          includeGroupByRegex("com\\.google.*")
                          includeGroupByRegex("androidx.*")
                      }
                  }
                  mavenCentral()
                  gradlePluginPortal()
                  maven(url = "https://jitpack.io")
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven(url = "https://jitpack.io")
                  // aliyun as fallback
                  maven(url = "https://maven.aliyun.com/repository/public")
              }
          }

          rootProject.name = "aicontrol"
          include(":app")
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AiControl-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
